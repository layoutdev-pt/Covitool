<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_menor.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Metadados Base (Serão lidos como fallback ou para a Homepage) -->
    <title>Covitool | Ferramentas para Construção e Obras Públicas</title>
    <meta name="description" content="A Covitool é um fornecedor B2B de excelência em peças e ferramentas para empresas de construção de obras públicas e particulares." />
    <link rel="canonical" href="https://covitool.pt/" />

    <!-- Open Graph / Social Media Fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://covitool.pt/" />
    <meta property="og:title" content="Covitool | Ferramentas para Construção e Obras Públicas" />
    <meta property="og:description" content="A Covitool é um fornecedor B2B de excelência em peças e ferramentas para empresas de construção de obras públicas e particulares." />
    <meta property="og:image" content="https://covitool.pt/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://covitool.pt/" />
    <meta property="twitter:title" content="Covitool | Ferramentas para Construção e Obras Públicas" />
    <meta property="twitter:description" content="A Covitool é um fornecedor B2B de excelência em peças e ferramentas para empresas de construção de obras públicas e particulares." />
    <meta property="twitter:image" content="https://covitool.pt/logo.png" />

    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" />

    <!-- Schema Markup (JSON-LD) Otimizado com Hierarquia -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Covitool",
            "url": "https://covitool.pt/"
          },
          {
            "@type": "HardwareStore",
            "name": "Covitool",
            "url": "https://covitool.pt/",
            "description": "Fornecedor B2B de excelência de ferramentas e peças de alta performance para empresas de construção de obras públicas e particulares.",
            "telephone": "+351275322030",
            "image": "https://covitool.pt/logo.png",
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "PT"
            }
          },
          {
            "@type": "ItemList",
            "itemListElement": [
              {
                "@type": "SiteNavigationElement",
                "position": 1,
                "name": "Home",
                "url": "https://covitool.pt/"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 2,
                "name": "Marcas",
                "url": "https://covitool.pt/marcas"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 3,
                "name": "Sobre Nós",
                "url": "https://covitool.pt/sobre-nos"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 4,
                "name": "Folhetos",
                "url": "https://covitool.pt/folhetos"
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-surface text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
